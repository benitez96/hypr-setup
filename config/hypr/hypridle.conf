general {
    lock_cmd = lock-screen                         # lock screen
    before_sleep_cmd = loginctl lock-session               # lock before suspend.
    after_sleep_cmd = hypr-dispatch "hl.dsp.dpms('on')" "dpms on" # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

listener {
    timeout = 300                                             # 5min
    on-timeout = pidof hyprlock || launch-screensaver # start screensaver (if we haven't locked already)
}

listener {
    timeout = 900                      # 15min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = 960                                            # 16min
    on-timeout = hypr-dispatch "hl.dsp.dpms('off')" "dpms off"                   # screen off when timeout has passed
    on-resume = hypr-dispatch "hl.dsp.dpms('on')" "dpms on" && brightnessctl -r  # screen on when activity is detected
}
