# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Keepass, exec, uwsm-app -- keepassxc
bindd = SUPER SHIFT, C, Opencode, exec, launch-tui opencode "$(cmd-terminal-cwd)"
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser (private), exec, launch-browser --private
bindd = SUPER, B, Browser, exec, launch-browser --public
bindd = SUPER, N, Editor, exec, launch-editor
bindd = SUPER SHIFT, T, Activity, exec, launch-tui btop
bindd = SUPER, I, Wifi, exec, launch-tui impala
bindd = SUPER SHIFT, I, Bluetooth, exec, launch-tui bluetui
bindd = SUPER, D, Docker, exec, launch-tui lazydocker
bindd = SUPER SHIFT, S, Screenshot, exec, cmd-screenshot

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER, A, ChatGPT, exec, launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Grok, exec, launch-webapp "https://grok.com"
bindd = SUPER, Y, YouTube, exec, launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER, X, X, exec, launch-webapp "https://x.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, menu

bind = SUPER SHIFT, M, exec, hyprctl keyword monitor "eDP-1,disable"
bind = SUPER SHIFT, N, exec, hyprctl keyword monitor "eDP-1,2240x1400@60,auto,auto"
