# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# ===== SETUP SIMPLE - SIN DISABLE =====

# Ultrawide Samsung 34" (si está conectado)
monitor=DP-2,3440x1440@60,auto,1

# Notebook (siempre habilitado como fallback)
monitor=eDP-1,2240x1400@60,auto,auto

env = GDK_SCALE,1

# SOLUCIÓN AL "ESPACIO FANTASMA":
# Cuando tengas el ultrawide conectado y la notebook cerrada, el espacio fantasma desaparece solo
# porque la notebook está físicamente cerrada.
# 
# Si tenés la notebook ABIERTA con el ultrawide conectado y te molesta el espacio extra:
# Agregá este atajo en bindings.conf para deshabilitar/habilitar la notebook manualmente:
# bind = SUPER SHIFT, M, exec, hyprctl keyword monitor "eDP-1,disable"
# bind = SUPER SHIFT, N, exec, hyprctl keyword monitor "eDP-1,2240x1400@60,auto,auto"
