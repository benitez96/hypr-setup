# Floating windows
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 875 600, match:tag floating-window

# Apps installed by default that should float
windowrule = tag +floating-window, match:class (org.hypr.bluetui|org.hypr.impala|org.hypr.wiremix|org.hypr.emit-double|org.hypr.btop|org.hypr.terminal|org.hypr.bash|org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|Hypr|About|TUI.float|imv|mpv)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule = float on, match:class org.gnome.Calculator

# Fullscreen screensaver
windowrule = fullscreen on, match:class org.hypr.screensaver
windowrule = float on, match:class org.hypr.screensaver

# No transparency on media windows (only apps installed by default)
windowrule = opacity 1 1, match:class ^(mpv|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$

# Popped window rounding
windowrule = rounding 10, match:tag pop

# Prevent idle while open
windowrule = idle_inhibit always, match:tag noidle
